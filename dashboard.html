<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepliQ — Tableau de bord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0d11;
            --bg-soft: #10131a;
            --panel: #141821;
            --panel-2: #191e29;
            --border: #232a37;
            --text: #eef1f6;
            --text-dim: #9aa3b2;
            --text-faint: #6b7383;
            --accent: #25d366;
            --accent-dim: #1a9950;
            --accent-glow: rgba(37, 211, 102, 0.18);
            --amber: #f0d77b;
            --amber-bg: #3a2f14;
            --amber-border: #6b551f;
            --danger: #ff6b6b;
            --danger-bg: #2c1518;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(37, 211, 102, 0.08), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(37, 211, 102, 0.05), transparent 55%),
                var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        h1, h2, h3, .logo, .convo-phone, .price-name {
            font-family: 'Sora', sans-serif;
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        /* ---------- LOGIN ---------- */
        #login {
            margin: auto;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            padding: 40px 36px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        #login h2 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-sub {
            color: var(--text-dim);
            font-size: 13px;
            margin: 0 0 22px;
        }

        .logo-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow), 0 0 0 4px var(--accent-glow);
        }

        #login input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        #login input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #login button,
        .refresh-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        #login button:hover,
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px var(--accent-glow);
        }

        /* ---------- APP LAYOUT ---------- */
        #app {
            display: none;
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background: var(--bg-soft);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            height: 100vh;
            flex-shrink: 0;
        }

        .sidebar-head {
            padding: 20px 18px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            background: var(--bg-soft);
            z-index: 2;
        }

        .sidebar-head .logo {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        .sidebar-head .count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
        }

        .convo-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .12s ease;
            border-left: 3px solid transparent;
        }

        .convo-item:hover {
            background: var(--panel);
        }

        .convo-item.active {
            background: var(--panel-2);
            border-left: 3px solid var(--accent);
        }

        .convo-phone {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        .convo-preview {
            font-size: 12.5px;
            color: var(--text-dim);
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-family: 'IBM Plex Mono', monospace;
        }

        .badge.bot {
            background: rgba(37, 211, 102, 0.14);
            color: var(--accent);
            border: 1px solid rgba(37, 211, 102, 0.35);
        }

        .badge.human {
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-border);
        }

        .badge.completed {
            background: var(--panel-2);
            color: var(--text-faint);
            border: 1px solid var(--border);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        .header {
            padding: 18px 26px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
        }

        #activePhone {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            letter-spacing: -0.01em;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-actions button {
            padding: 9px 15px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: background .12s ease, transform .12s ease, border-color .12s ease;
        }

        .header-actions button:hover {
            background: var(--panel-2);
            transform: translateY(-1px);
        }

        .header-actions button.danger {
            border-color: var(--danger);
            background: var(--danger-bg);
            color: #ffb3b3;
        }

        .header-actions button.danger:hover {
            background: #3a1c1f;
        }

        .header-actions button.primary {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
        }

        .header-actions button.primary:hover {
            background: rgba(37, 211, 102, 0.26);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: livePulse 1.8s ease-in-out infinite;
        }

        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 7px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .thread {
            flex: 1;
            overflow-y: auto;
            padding: 30px 34px;
            background:
                radial-gradient(600px 300px at 100% 0%, rgba(37, 211, 102, 0.04), transparent 60%);
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 18px;
            max-width: 72%;
            animation: msgIn .22s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user {
            margin-right: auto;
        }

        .msg-row.assistant,
        .msg-row.agent {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .avatar.user {
            background: var(--panel-2);
            border: 1px solid var(--border);
        }

        .avatar.assistant {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        }

        .avatar.agent {
            background: linear-gradient(135deg, var(--amber), #c9a53f);
        }

        .msg-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .msg-row.assistant .msg-col,
        .msg-row.agent .msg-col {
            align-items: flex-end;
        }

        .sender-label {
            font-size: 11px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.02em;
            margin-bottom: 5px;
            padding: 0 3px;
        }

        .sender-label.user { color: var(--text-faint); }
        .sender-label.assistant { color: var(--accent); }
        .sender-label.agent { color: var(--amber); }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
            word-break: break-word;
        }

        .bubble strong {
            font-weight: 700;
        }

        .bubble.user {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .bubble.assistant {
            background: linear-gradient(160deg, #1fae5c, #12723c);
            color: #f2fff7;
            border-bottom-right-radius: 5px;
        }

        .bubble.agent {
            background: linear-gradient(160deg, #4a3d17, #372c11);
            border: 1px solid var(--amber-border);
            color: #fff3d6;
            border-bottom-right-radius: 5px;
        }

        .bubble-time {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 6px;
            font-family: 'IBM Plex Mono', monospace;
            padding: 0 3px;
        }

        .msg-row.assistant .bubble-time,
        .msg-row.agent .bubble-time {
            text-align: right;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 16px 26px;
            border-top: 1px solid var(--border);
            background: var(--bg-soft);
        }

        .composer input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 14px;
            font-family: 'Manrope', sans-serif;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .composer input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .composer button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--accent-glow);
            transition: transform .12s ease;
        }

        .composer button:hover {
            transform: translateY(-1px);
        }

        .composer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .empty {
            margin: auto;
            color: var(--text-faint);
            text-align: center;
            font-size: 14px;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---------- CONFIRM MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 8, 11, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 380px;
            max-width: calc(100vw - 40px);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 26px 26px 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
            transform: translateY(10px) scale(0.97);
            transition: transform .2s cubic-bezier(.2,.8,.2,1);
        }

        .modal-overlay.show .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .modal-icon.human { background: var(--amber-bg); border: 1px solid var(--amber-border); }
        .modal-icon.bot { background: var(--accent-glow); border: 1px solid rgba(37,211,102,0.35); }
        .modal-icon.completed { background: var(--danger-bg); border: 1px solid var(--danger); }

        .modal-title {
            font-family: 'Sora', sans-serif;
            font-size: 16.5px;
            font-weight: 700;
            margin: 0 0 8px;
            letter-spacing: -0.01em;
        }

        .modal-body {
            font-size: 13.5px;
            color: var(--text-dim);
            line-height: 1.55;
            margin: 0 0 22px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-actions button {
            padding: 10px 18px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
        }

        .modal-actions button:hover {
            transform: translateY(-1px);
            background: var(--panel-2);
        }

        .modal-actions button.confirm-human {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .modal-actions button.confirm-bot {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .modal-actions button.confirm-completed {
            border-color: var(--danger);
            background: linear-gradient(135deg, #ff6b6b, #c93f3f);
            color: #2a0808;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
        }
    </style>
    <base target="_blank">
</head>

<body>

    <div id="login">
        <h2><span class="logo-dot"></span>RepliQ</h2>
        <p class="login-sub">Tableau de bord — accès conseiller</p>
        <input type="password" id="secretInput" placeholder="Mot de passe" />
        <button onclick="tryLogin()">Entrer</button>
        <p id="loginError" style="color:#ff6b6b;font-size:13px;"></p>
    </div>

    <div id="app">
        <div class="sidebar" id="sidebar"></div>
        <div class="main">
            <div class="header">
                <div>
                    <strong id="activePhone">Sélectionnez une conversation</strong>
                    <span id="modeBadge" class="badge bot" style="display:none;"></span>
                </div>
                <div class="header-actions" id="headerActions" style="display:none;">
                    <button class="primary" onclick="setMode('human')">👤 Prendre en charge</button>
                    <button onclick="setMode('bot')">🤖 Rendre au bot</button>
                    <button class="danger" onclick="setMode('completed')">✅ Terminer la conversation</button>
                    <span class="live-indicator"><span class="live-dot"></span>En direct</span>
                </div>
            </div>
            <div class="thread" id="thread">
                <div class="empty">Aucune conversation sélectionnée</div>
            </div>
            <div class="composer" id="composer" style="display:none;">
                <input type="text" id="replyInput" placeholder="Répondre au client en tant que conseiller…"
                    onkeydown="if(event.key==='Enter')sendReply()" />
                <button id="replyBtn" onclick="sendReply()">Envoyer</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon"></div>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-body" id="modalBody"></p>
            <div class="modal-actions">
                <button onclick="closeConfirmModal(false)">Annuler</button>
                <button id="modalConfirmBtn" onclick="closeConfirmModal(true)">Confirmer</button>
            </div>
        </div>
    </div>

    <script>
        let SECRET = localStorage.getItem("repliq_dashboard_key") || "";
        let conversations = [];
        let activePhone = null;

        const MODE_LABELS = { bot: "Bot", human: "Humain", completed: "Terminée" };

        function tryLogin() {
            SECRET = document.getElementById("secretInput").value;
            loadConversations(true);
        }

        let pollTimer = null;
        const POLL_INTERVAL_MS = 4000;

        async function loadConversations(isLogin = false) {
            try {
                const res = await fetch("/api/dashboard?key=" + encodeURIComponent(SECRET));
                if (res.status === 401) {
                    document.getElementById("loginError").textContent = "Mot de passe incorrect.";
                    return;
                }
                const data = await res.json();
                conversations = data.conversations || [];
                localStorage.setItem("repliq_dashboard_key", SECRET);
                document.getElementById("login").style.display = "none";
                document.getElementById("app").style.display = "flex";
                renderSidebar();
                if (activePhone) renderThread(activePhone);

                // Start live polling once we're successfully in — no manual
                // refresh button needed, the dashboard just stays up to date.
                if (!pollTimer) {
                    pollTimer = setInterval(loadConversations, POLL_INTERVAL_MS);
                }
            } catch (err) {
                document.getElementById("loginError").textContent = "Erreur de connexion.";
                console.error(err);
            }
        }

        function modeBadgeHtml(mode) {
            const m = mode || "bot";
            return `<span class="badge ${m}">${MODE_LABELS[m] || m}</span>`;
        }

        function renderSidebar() {
            const sidebar = document.getElementById("sidebar");
            const head = `<div class="sidebar-head"><span class="logo"><span class="logo-dot"></span>RepliQ</span><span class="count">${conversations.length} conv.</span></div>`;
            if (conversations.length === 0) {
                sidebar.innerHTML = head + '<div class="empty" style="padding:24px;">Aucune conversation pour l\'instant.</div>';
                return;
            }
            sidebar.innerHTML = head + conversations.map(c => {
                const last = c.messages[c.messages.length - 1];
                const preview = last ? last.content : "";
                return `<div class="convo-item ${c.phone === activePhone ? 'active' : ''}" onclick="renderThread('${c.phone}')">
        <div class="convo-phone">+${c.phone} ${modeBadgeHtml(c.mode)}</div>
        <div class="convo-preview">${preview.replace(/</g, "&lt;")}</div>
      </div>`;
            }).join("");
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Turns raw bot/user text into clean, safe HTML: escapes everything
        // first (so no injection), then re-introduces basic formatting the
        // bot commonly uses — **bold** and literal "<br>" markers — as real
        // markup, and collapses extra blank lines for a tidier look.
        function formatContent(text) {
            let safe = escapeHtml(text);
            safe = safe.replace(/&lt;br\s*\/?&gt;/gi, "\n");
            safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            safe = safe.replace(/\n{3,}/g, "\n\n");
            return safe;
        }

        const ROLE_LABELS = { user: "Client", assistant: "RepliQ", agent: "Conseiller" };
        const ROLE_AVATARS = { user: "🙂", assistant: "🤖", agent: "👤" };

        function renderThread(phone) {
            activePhone = phone;
            document.getElementById("activePhone").textContent = "+" + phone;

            const convo = conversations.find(c => c.phone === phone);
            const badge = document.getElementById("modeBadge");
            const mode = convo?.mode || "bot";
            badge.textContent = MODE_LABELS[mode] || mode;
            badge.className = "badge " + mode;
            badge.style.display = "inline-block";

            document.getElementById("headerActions").style.display = "flex";
            document.getElementById("composer").style.display = "flex";

            const thread = document.getElementById("thread");
            if (!convo || convo.messages.length === 0) {
                thread.innerHTML = '<div class="empty">Pas encore de messages.</div>';
                return;
            }
            thread.innerHTML = convo.messages.map(m => {
                const role = ROLE_LABELS[m.role] ? m.role : "assistant";
                const time = m.ts ? new Date(m.ts).toLocaleString("fr-FR") : "";
                return `<div class="msg-row ${role}">
        <div class="avatar ${role}">${ROLE_AVATARS[role]}</div>
        <div class="msg-col">
          <div class="sender-label ${role}">${ROLE_LABELS[role]}</div>
          <div class="bubble ${role}">${formatContent(m.content)}</div>
          <div class="bubble-time">${time}</div>
        </div>
      </div>`;
            }).join("");
            thread.scrollTop = thread.scrollHeight;
            renderSidebar();
        }

        const MODAL_CONTENT = {
            human: {
                icon: "👤",
                iconClass: "human",
                title: "Prendre en charge la conversation",
                body: "Le bot arrêtera de répondre automatiquement à ce client. Vous pourrez lui écrire directement en tant que conseiller.",
                confirmLabel: "Prendre en charge",
                confirmClass: "confirm-human"
            },
            bot: {
                icon: "🤖",
                iconClass: "bot",
                title: "Rendre la conversation au bot",
                body: "RepliQ reprendra automatiquement la conversation avec ce client à partir de maintenant.",
                confirmLabel: "Rendre au bot",
                confirmClass: "confirm-bot"
            },
            completed: {
                icon: "✅",
                iconClass: "completed",
                title: "Terminer la conversation",
                body: "Le bot se taira définitivement sur cette conversation. Cette action est utile une fois la demande du client résolue.",
                confirmLabel: "Terminer",
                confirmClass: "confirm-completed"
            }
        };

        let modalResolve = null;

        function openConfirmModal(action) {
            const c = MODAL_CONTENT[action];
            const icon = document.getElementById("modalIcon");
            icon.textContent = c.icon;
            icon.className = "modal-icon " + c.iconClass;
            document.getElementById("modalTitle").textContent = c.title;
            document.getElementById("modalBody").textContent = c.body;
            const btn = document.getElementById("modalConfirmBtn");
            btn.textContent = c.confirmLabel;
            btn.className = c.confirmClass;
            document.getElementById("modalOverlay").classList.add("show");
            return new Promise(resolve => { modalResolve = resolve; });
        }

        function closeConfirmModal(result) {
            document.getElementById("modalOverlay").classList.remove("show");
            if (modalResolve) {
                modalResolve(result);
                modalResolve = null;
            }
        }

        document.getElementById("modalOverlay").addEventListener("click", (e) => {
            if (e.target.id === "modalOverlay") closeConfirmModal(false);
        });

        async function setMode(action) {
            if (!activePhone) return;
            const confirmed = await openConfirmModal(action);
            if (!confirmed) return;

            try {
                const res = await fetch("/api/conversation?key=" + encodeURIComponent(SECRET), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: activePhone, action })
                });
                const data = await res.json();
                if (!res.ok) {
                    toast("Erreur : " + (data.error || res.status));
                    return;
                }
                toast("Conversation mise à jour ✅");
                await loadConversations();
            } catch (err) {
                console.error(err);
                toast("Erreur de connexion.");
            }
        }

        async function sendReply() {
            if (!activePhone) return;
            const input = document.getElementById("replyInput");
            const text = input.value.trim();
            if (!text) return;

            const activeConversation = conversations.find(c => c.phone === activePhone);

            const btn = document.getElementById("replyBtn");
            btn.disabled = true;
            try {
                const res = await fetch("/api/conversation?key=" + encodeURIComponent(SECRET), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        phone: activePhone,
                        phoneNumberId: activeConversation?.phoneNumberId || "",
                        action: "reply",
                        message: text
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    toast("Erreur : " + (data.details || data.error || res.status));
                    return;
                }
                input.value = "";
                await loadConversations();
            } catch (err) {
                console.error(err);
                toast("Erreur de connexion.");
            } finally {
                btn.disabled = false;
            }
        }

        let toastTimer = null;
        function toast(msg) {
            const el = document.getElementById("toast");
            el.textContent = msg;
            el.style.display = "block";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.display = "none"; }, 3000);
        }

        // Auto-login if a key was saved before.
        if (SECRET) loadConversations();
    </script>

</body>

</html>

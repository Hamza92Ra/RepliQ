<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepliQ — Tableau de bord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0d11;
            --bg-soft: #10131a;
            --panel: #141821;
            --panel-2: #191e29;
            --panel-3: #1e2430;
            --border: #232a37;
            --border-soft: #1b212c;
            --text: #eef1f6;
            --text-dim: #9aa3b2;
            --text-faint: #6b7383;
            --accent: #25d366;
            --accent-dim: #1a9950;
            --accent-glow: rgba(37, 211, 102, 0.18);
            --amber: #f0d77b;
            --amber-bg: #3a2f14;
            --amber-border: #6b551f;
            --danger: #ff6b6b;
            --danger-bg: #2c1518;
            --blue: #6fa2ff;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(37, 211, 102, 0.08), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(37, 211, 102, 0.05), transparent 55%),
                var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        h1, h2, h3, .logo, .convo-phone, .price-name {
            font-family: 'Sora', sans-serif;
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        /* ---------- LOGIN ---------- */
        #login {
            margin: auto;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            padding: 40px 36px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        #login h2 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-sub {
            color: var(--text-dim);
            font-size: 13px;
            margin: 0 0 22px;
        }

        .logo-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow), 0 0 0 4px var(--accent-glow);
        }

        #login input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        #login input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #login button,
        .refresh-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        #login button:hover,
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px var(--accent-glow);
        }

        #login button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(5, 23, 12, 0.35);
            border-top-color: #05170c;
            display: inline-block;
            vertical-align: -2px;
            margin-right: 7px;
            animation: spin .7s linear infinite;
        }

        .spinner.light {
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--text);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- APP LAYOUT ---------- */
        #app {
            display: none;
            width: 100%;
        }

        .sidebar {
            width: 330px;
            background: var(--bg-soft);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-head {
            padding: 18px 18px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            background: var(--bg-soft);
            z-index: 3;
        }

        .sidebar-head .logo {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        .sidebar-head .count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
        }

        .logout-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background .12s ease, color .12s ease, border-color .12s ease;
        }

        .logout-btn:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #ffb3b3;
        }

        .search-wrap {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 61px;
            background: var(--bg-soft);
            z-index: 3;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box svg {
            position: absolute;
            left: 11px;
            width: 14px;
            height: 14px;
            color: var(--text-faint);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 32px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            line-height: 1;
        }

        .search-clear:hover {
            color: var(--text);
        }

        .convo-list {
            flex: 1;
            overflow-y: auto;
        }

        .convo-item {
            padding: 13px 18px;
            border-bottom: 1px solid var(--border-soft);
            cursor: pointer;
            transition: background .12s ease;
            border-left: 3px solid transparent;
            position: relative;
        }

        .convo-item:hover {
            background: var(--panel);
        }

        .convo-item:hover .convo-delete {
            opacity: 1;
            pointer-events: auto;
        }

        .convo-item.active {
            background: var(--panel-2);
            border-left: 3px solid var(--accent);
        }

        .convo-item.unread .convo-phone {
            color: var(--text);
            font-weight: 800;
        }

        .convo-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            flex-shrink: 0;
        }

        .convo-time {
            margin-left: auto;
            font-size: 10.5px;
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            flex-shrink: 0;
        }

        .convo-delete {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--panel-3);
            color: var(--text-dim);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
        }

        .convo-delete:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #ffb3b3;
        }

        .sidebar-tabs {
            display: flex;
            gap: 6px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 115px;
            background: var(--bg-soft);
            z-index: 3;
        }

        .sidebar-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 8px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: background .12s ease, color .12s ease, border-color .12s ease;
        }

        .sidebar-tab:hover {
            background: var(--panel-2);
        }

        .sidebar-tab.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }

        .tab-count {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            padding: 1px 6px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
        }

        .sidebar-tab.active .tab-count {
            background: rgba(37, 211, 102, 0.22);
        }

        .convo-phone {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
            color: var(--text-dim);
        }

        .convo-preview {
            font-size: 12.5px;
            color: var(--text-dim);
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 20px;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-family: 'IBM Plex Mono', monospace;
        }

        .badge.bot {
            background: rgba(37, 211, 102, 0.14);
            color: var(--accent);
            border: 1px solid rgba(37, 211, 102, 0.35);
        }

        .badge.human {
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-border);
        }

        .badge.completed {
            background: var(--panel-2);
            color: var(--text-faint);
            border: 1px solid var(--border);
        }

        .badge.lead {
            background: rgba(79, 140, 255, 0.14);
            color: var(--blue);
            border: 1px solid rgba(79, 140, 255, 0.35);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        .header {
            padding: 18px 26px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
        }

        #activePhone {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            letter-spacing: -0.01em;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .header-actions button {
            padding: 9px 15px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: background .12s ease, transform .12s ease, border-color .12s ease;
        }

        .header-actions button:hover {
            background: var(--panel-2);
            transform: translateY(-1px);
        }

        .header-actions button.danger {
            border-color: var(--danger);
            background: var(--danger-bg);
            color: #ffb3b3;
        }

        .header-actions button.danger:hover {
            background: #3a1c1f;
        }

        .header-actions button.primary {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
        }

        .header-actions button.primary:hover {
            background: rgba(37, 211, 102, 0.26);
        }

        .icon-btn {
            width: 36px;
            padding: 9px 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: livePulse 1.8s ease-in-out infinite;
        }

        .live-indicator.offline .live-dot {
            background: var(--danger);
            animation: none;
            box-shadow: none;
        }

        .live-indicator.offline {
            color: #ffb3b3;
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 7px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .thread {
            flex: 1;
            overflow-y: auto;
            padding: 30px 34px;
            background:
                radial-gradient(600px 300px at 100% 0%, rgba(37, 211, 102, 0.04), transparent 60%);
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 18px;
            max-width: 72%;
        }

        .msg-row .avatar {
            margin-top: 20px;
        }

        .msg-row.msg-new {
            animation: msgIn .22s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user {
            margin-right: auto;
        }

        .msg-row.lead {
            margin-right: auto;
        }

        .msg-row.assistant,
        .msg-row.agent {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .avatar.user {
            background: var(--panel-2);
            border: 1px solid var(--border);
        }

        .avatar.assistant {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        }

        .avatar.agent {
            background: linear-gradient(135deg, var(--amber), #c9a53f);
        }

        .avatar.lead {
            background: linear-gradient(135deg, var(--blue), #2f5fd6);
        }

        .msg-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .msg-row.assistant .msg-col,
        .msg-row.agent .msg-col {
            align-items: flex-end;
        }

        .sender-label {
            font-size: 11px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.02em;
            margin-bottom: 5px;
            padding: 0 3px;
        }

        .sender-label.user { color: var(--text-faint); }
        .sender-label.assistant { color: var(--accent); }
        .sender-label.agent { color: var(--amber); }
        .sender-label.lead { color: var(--blue); }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
            word-break: break-word;
        }

        .bubble strong {
            font-weight: 700;
        }

        .bubble.user {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .bubble.assistant {
            background: linear-gradient(160deg, #1fae5c, #12723c);
            color: #f2fff7;
            border-bottom-right-radius: 5px;
        }

        .bubble.agent {
            background: linear-gradient(160deg, #4a3d17, #372c11);
            border: 1px solid var(--amber-border);
            color: #fff3d6;
            border-bottom-right-radius: 5px;
        }

        .bubble.lead {
            background: linear-gradient(160deg, #16233f, #101a30);
            border: 1px solid #2f4a80;
            color: #eaf1ff;
            border-bottom-left-radius: 5px;
        }

        .bubble-time {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 6px;
            font-family: 'IBM Plex Mono', monospace;
            padding: 0 3px;
        }

        .msg-row.assistant .bubble-time,
        .msg-row.agent .bubble-time {
            text-align: right;
        }

        .day-divider {
            text-align: center;
            margin: 22px 0;
            font-size: 11px;
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            position: relative;
        }

        .day-divider span {
            background: var(--bg);
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }

        .day-divider::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 1px;
            background: var(--border);
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px 26px;
            border-top: 1px solid var(--border);
            background: var(--bg-soft);
            align-items: flex-end;
        }

        .composer textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 14px;
            font-family: 'Manrope', sans-serif;
            outline: none;
            resize: none;
            max-height: 140px;
            line-height: 1.5;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .composer textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .composer-hint {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 4px;
            padding-left: 2px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .composer button {
            padding: 13px 22px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--accent-glow);
            transition: transform .12s ease;
            flex-shrink: 0;
        }

        .composer button:hover {
            transform: translateY(-1px);
        }

        .composer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .empty {
            margin: auto;
            color: var(--text-faint);
            text-align: center;
            font-size: 14px;
            padding: 24px;
            max-width: 280px;
            line-height: 1.6;
        }

        .empty .empty-icon {
            font-size: 30px;
            display: block;
            margin-bottom: 10px;
            opacity: .7;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 9px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: toastIn .2s cubic-bezier(.2,.8,.2,1);
        }

        #toast.error {
            border-color: var(--danger);
            background: var(--danger-bg);
            color: #ffb3b3;
        }

        #toast.success {
            border-color: var(--accent);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---------- CONFIRM MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 8, 11, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 380px;
            max-width: calc(100vw - 40px);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 26px 26px 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
            transform: translateY(10px) scale(0.97);
            transition: transform .2s cubic-bezier(.2,.8,.2,1);
        }

        .modal-overlay.show .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .modal-icon.human { background: var(--amber-bg); border: 1px solid var(--amber-border); }
        .modal-icon.bot { background: var(--accent-glow); border: 1px solid rgba(37,211,102,0.35); }
        .modal-icon.completed { background: var(--danger-bg); border: 1px solid var(--danger); }
        .modal-icon.delete { background: var(--danger-bg); border: 1px solid var(--danger); }

        .modal-title {
            font-family: 'Sora', sans-serif;
            font-size: 16.5px;
            font-weight: 700;
            margin: 0 0 8px;
            letter-spacing: -0.01em;
        }

        .modal-body {
            font-size: 13.5px;
            color: var(--text-dim);
            line-height: 1.55;
            margin: 0 0 22px;
        }

        .modal-body strong {
            color: var(--text);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-actions button {
            padding: 10px 18px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
        }

        .modal-actions button:hover {
            transform: translateY(-1px);
            background: var(--panel-2);
        }

        .modal-actions button.confirm-human {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .modal-actions button.confirm-bot {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #05170c;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .modal-actions button.confirm-completed,
        .modal-actions button.confirm-delete {
            border-color: var(--danger);
            background: linear-gradient(135deg, #ff6b6b, #c93f3f);
            color: #2a0808;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
        }

        /* ---------- MOBILE ---------- */
        .menu-toggle {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 860px) {
            #app {
                position: relative;
            }

            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100dvh;
                width: 86vw;
                max-width: 340px;
                z-index: 60;
                transform: translateX(-100%);
                transition: transform .25s cubic-bezier(.2,.8,.2,1);
                box-shadow: 20px 0 50px rgba(0,0,0,0.4);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 55;
                opacity: 0;
                pointer-events: none;
                transition: opacity .2s ease;
            }

            .sidebar-overlay.show {
                opacity: 1;
                pointer-events: auto;
            }

            .header {
                padding: 14px 16px;
                gap: 10px;
            }

            #activePhone {
                font-size: 14px;
            }

            .header-actions {
                width: 100%;
                gap: 6px;
            }

            .header-actions button,
            .live-indicator {
                flex: 1 1 auto;
                padding: 10px 8px;
                font-size: 12px;
                justify-content: center;
                text-align: center;
            }

            .thread {
                padding: 18px 14px;
            }

            .msg-row {
                max-width: 88%;
                gap: 7px;
                margin-bottom: 14px;
            }

            .avatar {
                width: 26px;
                height: 26px;
                font-size: 12px;
            }

            .bubble {
                font-size: 14px;
                padding: 10px 13px;
            }

            .composer {
                padding: 12px 14px;
            }

            .composer textarea {
                font-size: 16px; /* prevents iOS auto-zoom on focus */
            }

            .composer button {
                padding: 12px 18px;
            }

            .modal-card {
                width: calc(100vw - 32px);
                padding: 22px 20px 18px;
            }
        }

        @media (max-width: 420px) {
            .header-actions button span.btn-text {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
    <base target="_blank">
</head>

<body>

    <div id="login">
        <h2><span class="logo-dot"></span>RepliQ</h2>
        <p class="login-sub">Tableau de bord — accès conseiller</p>
        <input type="password" id="secretInput" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')tryLogin()" />
        <button id="loginBtn" onclick="tryLogin()">Entrer</button>
        <p id="loginError" style="color:#ff6b6b;font-size:13px; margin: 12px 0 0;"></p>
    </div>

    <div id="app">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
        <div class="sidebar" id="sidebar"></div>
        <div class="main">
            <div class="header">
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
                    <div>
                        <strong id="activePhone">Sélectionnez une conversation</strong>
                        <span id="modeBadge" class="badge bot" style="display:none;"></span>
                    </div>
                </div>
                <div class="header-actions" id="headerActions" style="display:none;">
                    <button class="primary" onclick="setMode('human')">👤 <span class="btn-text">Prendre en charge</span></button>
                    <button onclick="setMode('bot')">🤖 <span class="btn-text">Rendre au bot</span></button>
                    <button class="danger" onclick="setMode('completed')">✅ <span class="btn-text">Terminer</span></button>
                    <button class="danger icon-btn" onclick="confirmDelete(activePhone)" title="Supprimer la conversation" aria-label="Supprimer la conversation">🗑️</button>
                    <span class="live-indicator" id="liveIndicator"><span class="live-dot"></span><span class="btn-text" id="liveLabel">En direct</span></span>
                </div>
            </div>
            <div class="thread" id="thread">
                <div class="empty"><span class="empty-icon">💬</span>Sélectionnez une conversation dans la liste pour afficher les messages.</div>
            </div>
            <div class="composer" id="composer" style="display:none;">
                <div style="flex:1;">
                    <textarea id="replyInput" rows="1" placeholder="Répondre au client en tant que conseiller…"
                        onkeydown="handleComposerKey(event)" oninput="autoGrow(this)"></textarea>
                </div>
                <button id="replyBtn" onclick="sendReply()">Envoyer</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon"></div>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-body" id="modalBody"></p>
            <div class="modal-actions">
                <button onclick="closeConfirmModal(false)">Annuler</button>
                <button id="modalConfirmBtn" onclick="closeConfirmModal(true)">Confirmer</button>
            </div>
        </div>
    </div>

    <script>
        let SECRET = localStorage.getItem("repliq_dashboard_key") || "";
        let conversations = [];
        let activePhone = null;
        let activeTab = "chats"; // "chats" | "leads" — which page of the sidebar is showing
        let searchQuery = "";

        // Per-conversation "last viewed" timestamps, kept locally per browser
        // so we can show an unread indicator without needing backend support.
        let lastSeen = {};
        try { lastSeen = JSON.parse(localStorage.getItem("repliq_last_seen") || "{}"); } catch (e) { lastSeen = {}; }

        function persistLastSeen() {
            try { localStorage.setItem("repliq_last_seen", JSON.stringify(lastSeen)); } catch (e) {}
        }

        function setActiveTab(tab) {
            activeTab = tab;
            renderSidebar();
        }

        const MODE_LABELS = { bot: "Bot", human: "Humain", completed: "Terminée" };

        function logout() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            localStorage.removeItem("repliq_dashboard_key");
            SECRET = "";
            conversations = [];
            activePhone = null;
            lastDataSnapshot = null;
            renderedCounts = {};

            document.getElementById("secretInput").value = "";
            document.getElementById("loginError").textContent = "";
            document.getElementById("app").style.display = "none";
            document.getElementById("login").style.display = "block";
        }

        function tryLogin() {
            SECRET = document.getElementById("secretInput").value;
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner light"></span>Connexion…';
            loadConversations(true).finally(() => {
                btn.disabled = false;
                btn.textContent = "Entrer";
            });
        }

        let pollTimer = null;
        const POLL_INTERVAL_MS = 4000;
        let lastDataSnapshot = null;
        let renderedCounts = {}; // phone -> number of messages already rendered (so we don't replay entry animation on them)
        let consecutiveFailures = 0;

        function setLiveStatus(online) {
            const el = document.getElementById("liveIndicator");
            const label = document.getElementById("liveLabel");
            if (!el) return;
            el.classList.toggle("offline", !online);
            label.textContent = online ? "En direct" : "Hors ligne";
        }

        async function loadConversations(isLogin = false) {
            try {
                const res = await fetch("/api/dashboard?key=" + encodeURIComponent(SECRET));
                if (res.status === 401) {
                    document.getElementById("loginError").textContent = "Mot de passe incorrect.";
                    return;
                }
                const data = await res.json();
                const newConversations = data.conversations || [];
                const snapshot = JSON.stringify(newConversations);

                consecutiveFailures = 0;
                setLiveStatus(true);

                localStorage.setItem("repliq_dashboard_key", SECRET);
                document.getElementById("login").style.display = "none";
                document.getElementById("app").style.display = "flex";

                // Nothing actually changed since the last poll — skip the
                // re-render entirely. This is what removes the flash: we
                // were rebuilding (and re-animating) the whole thread every
                // 4s even when there was nothing new to show.
                if (snapshot === lastDataSnapshot) {
                    if (!pollTimer) pollTimer = setInterval(loadConversations, POLL_INTERVAL_MS);
                    return;
                }
                lastDataSnapshot = snapshot;
                conversations = newConversations;

                renderSidebar();
                if (activePhone) renderThread(activePhone, true);

                // Start live polling once we're successfully in — no manual
                // refresh button needed, the dashboard just stays up to date.
                if (!pollTimer) {
                    pollTimer = setInterval(loadConversations, POLL_INTERVAL_MS);
                }
            } catch (err) {
                consecutiveFailures++;
                if (isLogin) {
                    document.getElementById("loginError").textContent = "Erreur de connexion.";
                } else if (consecutiveFailures >= 2) {
                    setLiveStatus(false);
                }
                console.error(err);
            }
        }

        function toggleSidebar(force) {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            const shouldOpen = typeof force === "boolean" ? force : !sidebar.classList.contains("mobile-open");
            sidebar.classList.toggle("mobile-open", shouldOpen);
            overlay.classList.toggle("show", shouldOpen);
        }

        function modeBadgeHtml(mode) {
            const m = mode || "bot";
            return `<span class="badge ${m}">${MODE_LABELS[m] || m}</span>`;
        }

        // A conversation is a "pending lead" only until it has an actual
        // message beyond the form submission — the moment they write on
        // WhatsApp (or an agent replies), it becomes a real conversation
        // and moves to that section automatically.
        function isPendingLead(convo) {
            return convo.messages.length > 0 && convo.messages.every(m => m.role === "lead");
        }

        function lastMessageTs(convo) {
            if (!convo.messages.length) return 0;
            const last = convo.messages[convo.messages.length - 1];
            return last.ts ? new Date(last.ts).getTime() : 0;
        }

        // Unread = the newest message is from the customer (not us) and is
        // newer than the last time this conservation was opened locally.
        function isUnread(convo) {
            if (!convo.messages.length) return false;
            const last = convo.messages[convo.messages.length - 1];
            if (last.role !== "user" && last.role !== "lead") return false;
            const ts = last.ts ? new Date(last.ts).getTime() : 0;
            const seen = lastSeen[convo.phone] || 0;
            return ts > seen;
        }

        function timeAgo(ts) {
            if (!ts) return "";
            const date = new Date(ts);
            const diffSec = Math.round((Date.now() - date.getTime()) / 1000);
            if (diffSec < 45) return "à l'instant";
            if (diffSec < 3600) return `il y a ${Math.round(diffSec / 60)} min`;
            if (diffSec < 86400) return `il y a ${Math.round(diffSec / 3600)} h`;
            if (diffSec < 172800) return "hier";
            if (diffSec < 604800) return `il y a ${Math.round(diffSec / 86400)} j`;
            return date.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
        }

        function matchesSearch(convo, q) {
            if (!q) return true;
            const needle = q.toLowerCase();
            if (convo.phone.toLowerCase().includes(needle)) return true;
            return convo.messages.some(m => (m.content || "").toLowerCase().includes(needle));
        }

        function onSearchInput(value) {
            searchQuery = value.trim();
            document.getElementById("searchClear").style.display = searchQuery ? "block" : "none";
            renderSidebar();
        }

        function clearSearch() {
            searchQuery = "";
            document.getElementById("searchInput").value = "";
            document.getElementById("searchClear").style.display = "none";
            renderSidebar();
        }

        function renderSidebar() {
            const sidebar = document.getElementById("sidebar");
            const head = `<div class="sidebar-head">
        <span class="logo"><span class="logo-dot"></span>RepliQ</span>
        <span class="count">${conversations.length} conv.</span>
        <button class="logout-btn" onclick="logout()" title="Déconnexion" aria-label="Déconnexion">⎋</button>
      </div>`;

            const search = `<div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="text" placeholder="Rechercher par numéro ou message…" value="${searchQuery.replace(/"/g, '&quot;')}" oninput="onSearchInput(this.value)" />
          <button class="search-clear" id="searchClear" style="display:${searchQuery ? 'block' : 'none'};" onclick="clearSearch()" aria-label="Effacer la recherche">✕</button>
        </div>
      </div>`;

            if (conversations.length === 0) {
                sidebar.innerHTML = head + search + '<div class="empty" style="padding:24px;">Aucune conversation pour l\'instant.</div>';
                return;
            }

            const leads = conversations.filter(isPendingLead).sort((a, b) => lastMessageTs(b) - lastMessageTs(a));
            const chats = conversations.filter(c => !isPendingLead(c)).sort((a, b) => lastMessageTs(b) - lastMessageTs(a));

            function convoItemHtml(c) {
                const last = c.messages[c.messages.length - 1];
                const preview = last ? last.content : "";
                const badge = isPendingLead(c)
                    ? '<span class="badge lead">Nouvelle</span>'
                    : modeBadgeHtml(c.mode);
                const unread = isUnread(c);
                const time = timeAgo(lastMessageTs(c));
                return `<div class="convo-item ${c.phone === activePhone ? 'active' : ''} ${unread ? 'unread' : ''}" onclick="renderThread('${c.phone}')">
        <button class="convo-delete" onclick="event.stopPropagation(); confirmDelete('${c.phone}')" title="Supprimer" aria-label="Supprimer la conversation">🗑️</button>
        <div class="convo-top-row">
          <div class="convo-phone">${unread ? '<span class="unread-dot"></span>' : ''}+${c.phone}</div>
        </div>
        <div class="convo-top-row" style="margin-top:6px;">
          ${badge}
          <span class="convo-time">${time}</span>
        </div>
        <div class="convo-preview">${preview.replace(/</g, "&lt;")}</div>
      </div>`;
            }

            const tabs = `<div class="sidebar-tabs">
        <button class="sidebar-tab ${activeTab === 'chats' ? 'active' : ''}" onclick="setActiveTab('chats')">
          💬 Conversations <span class="tab-count">${chats.length}</span>
        </button>
        <button class="sidebar-tab ${activeTab === 'leads' ? 'active' : ''}" onclick="setActiveTab('leads')">
          📋 Commandes <span class="tab-count">${leads.length}</span>
        </button>
      </div>`;

            const activeItemsAll = activeTab === 'leads' ? leads : chats;
            const activeItems = activeItemsAll.filter(c => matchesSearch(c, searchQuery));

            let listHtml;
            if (activeItemsAll.length === 0) {
                listHtml = `<div class="empty" style="padding:24px;">${activeTab === 'leads' ? "Aucune nouvelle demande." : "Aucune conversation pour l'instant."}</div>`;
            } else if (activeItems.length === 0) {
                listHtml = `<div class="empty" style="padding:24px;">Aucun résultat pour « ${searchQuery.replace(/</g, "&lt;")} ».</div>`;
            } else {
                listHtml = activeItems.map(convoItemHtml).join("");
            }

            sidebar.innerHTML = head + search + tabs + `<div class="convo-list">${listHtml}</div>`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Turns raw bot/user text into clean, safe HTML: escapes everything
        // first (so no injection), then re-introduces basic formatting the
        // bot commonly uses — **bold** and literal "<br>" markers — as real
        // markup, and collapses extra blank lines for a tidier look.
        function formatContent(text) {
            let safe = escapeHtml(text);
            safe = safe.replace(/&lt;br\s*\/?&gt;/gi, "\n");
            safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            safe = safe.replace(/\n{3,}/g, "\n\n");
            return safe;
        }

        const ROLE_LABELS = { user: "Client", assistant: "RepliQ", agent: "Conseiller", lead: "Nouvelle demande" };
        const ROLE_AVATARS = { user: "🙂", assistant: "🤖", agent: "👤", lead: "📋" };

        function sameDay(a, b) {
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        }

        function dayLabel(date) {
            const now = new Date();
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            if (sameDay(date, now)) return "Aujourd'hui";
            if (sameDay(date, yesterday)) return "Hier";
            return date.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
        }

        function renderThread(phone, silent) {
            activePhone = phone;
            document.getElementById("activePhone").textContent = "+" + phone;
            if (!silent) toggleSidebar(false);

            const convo = conversations.find(c => c.phone === phone);
            const badge = document.getElementById("modeBadge");
            const mode = convo?.mode || "bot";
            badge.textContent = MODE_LABELS[mode] || mode;
            badge.className = "badge " + mode;
            badge.style.display = "inline-block";

            document.getElementById("headerActions").style.display = "flex";
            document.getElementById("composer").style.display = "flex";

            // Mark as seen locally so the unread dot clears.
            lastSeen[phone] = Date.now();
            persistLastSeen();

            const thread = document.getElementById("thread");
            if (!convo || convo.messages.length === 0) {
                thread.innerHTML = '<div class="empty"><span class="empty-icon">🗒️</span>Pas encore de messages sur cette conversation.</div>';
                renderSidebar();
                return;
            }
            const previouslyRendered = renderedCounts[phone] || 0;
            let lastDate = null;
            const rows = convo.messages.map((m, i) => {
                const role = ROLE_LABELS[m.role] ? m.role : "assistant";
                const dateObj = m.ts ? new Date(m.ts) : null;
                const time = dateObj ? dateObj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
                const isNew = i >= previouslyRendered;

                let divider = "";
                if (dateObj && (!lastDate || !sameDay(dateObj, lastDate))) {
                    divider = `<div class="day-divider"><span>${dayLabel(dateObj)}</span></div>`;
                    lastDate = dateObj;
                }

                return divider + `<div class="msg-row ${role}${isNew ? " msg-new" : ""}">
        <div class="avatar ${role}">${ROLE_AVATARS[role]}</div>
        <div class="msg-col">
          <div class="sender-label ${role}">${ROLE_LABELS[role]}</div>
          <div class="bubble ${role}">${formatContent(m.content)}</div>
          <div class="bubble-time">${time}</div>
        </div>
      </div>`;
            }).join("");
            thread.innerHTML = rows;
            renderedCounts[phone] = convo.messages.length;
            thread.scrollTop = thread.scrollHeight;
            renderSidebar();
        }

        const MODAL_CONTENT = {
            human: {
                icon: "👤",
                iconClass: "human",
                title: "Prendre en charge la conversation",
                body: "Le bot arrêtera de répondre automatiquement à ce client. Vous pourrez lui écrire directement en tant que conseiller.",
                confirmLabel: "Prendre en charge",
                confirmClass: "confirm-human"
            },
            bot: {
                icon: "🤖",
                iconClass: "bot",
                title: "Rendre la conversation au bot",
                body: "RepliQ reprendra automatiquement la conversation avec ce client à partir de maintenant.",
                confirmLabel: "Rendre au bot",
                confirmClass: "confirm-bot"
            },
            completed: {
                icon: "✅",
                iconClass: "completed",
                title: "Terminer la conversation",
                body: "Le bot se taira définitivement sur cette conversation. Cette action est utile une fois la demande du client résolue.",
                confirmLabel: "Terminer",
                confirmClass: "confirm-completed"
            },
            delete: {
                icon: "🗑️",
                iconClass: "delete",
                title: "Supprimer la conversation",
                body: "Tout l'historique de cette conversation sera définitivement supprimé. Cette action est irréversible.",
                confirmLabel: "Supprimer",
                confirmClass: "confirm-delete"
            }
        };

        let modalResolve = null;

        function openConfirmModal(action, bodyOverride) {
            const c = MODAL_CONTENT[action];
            const icon = document.getElementById("modalIcon");
            icon.textContent = c.icon;
            icon.className = "modal-icon " + c.iconClass;
            document.getElementById("modalTitle").textContent = c.title;
            document.getElementById("modalBody").innerHTML = bodyOverride || c.body;
            const btn = document.getElementById("modalConfirmBtn");
            btn.textContent = c.confirmLabel;
            btn.className = c.confirmClass;
            document.getElementById("modalOverlay").classList.add("show");
            return new Promise(resolve => { modalResolve = resolve; });
        }

        function closeConfirmModal(result) {
            document.getElementById("modalOverlay").classList.remove("show");
            if (modalResolve) {
                modalResolve(result);
                modalResolve = null;
            }
        }

        document.getElementById("modalOverlay").addEventListener("click", (e) => {
            if (e.target.id === "modalOverlay") closeConfirmModal(false);
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeConfirmModal(false);
        });

        async function setMode(action) {
            if (!activePhone) return;
            const confirmed = await openConfirmModal(action);
            if (!confirmed) return;

            try {
                const res = await fetch("/api/conversation?key=" + encodeURIComponent(SECRET), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: activePhone, action })
                });
                const data = await res.json();
                if (!res.ok) {
                    toast("Erreur : " + (data.error || res.status), "error");
                    return;
                }
                toast("Conversation mise à jour", "success");
                await loadConversations();
            } catch (err) {
                console.error(err);
                toast("Erreur de connexion.", "error");
            }
        }

        // Deleting is intentionally separate from setMode: it needs its own
        // "phone" argument (so it can be triggered from the sidebar's hover
        // icon on a conversation that isn't the active one), a distinct
        // backend action, and local cleanup of any cached per-phone state.
        async function confirmDelete(phone) {
            if (!phone) return;
            const confirmed = await openConfirmModal(
                "delete",
                `Tout l'historique de <strong>+${phone}</strong> sera définitivement supprimé. Cette action est irréversible.`
            );
            if (!confirmed) return;

            try {
                const res = await fetch("/api/conversation?key=" + encodeURIComponent(SECRET), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, action: "delete" })
                });
                let data = {};
                try { data = await res.json(); } catch (e) {}
                if (!res.ok) {
                    toast("Erreur : " + (data.error || res.status), "error");
                    return;
                }

                conversations = conversations.filter(c => c.phone !== phone);
                delete renderedCounts[phone];
                delete lastSeen[phone];
                persistLastSeen();
                lastDataSnapshot = JSON.stringify(conversations);

                if (activePhone === phone) {
                    activePhone = null;
                    document.getElementById("activePhone").textContent = "Sélectionnez une conversation";
                    document.getElementById("modeBadge").style.display = "none";
                    document.getElementById("headerActions").style.display = "none";
                    document.getElementById("composer").style.display = "none";
                    document.getElementById("thread").innerHTML = '<div class="empty"><span class="empty-icon">💬</span>Sélectionnez une conversation dans la liste pour afficher les messages.</div>';
                }

                renderSidebar();
                toast("Conversation supprimée", "success");
            } catch (err) {
                console.error(err);
                toast("Erreur de connexion.", "error");
            }
        }

        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 140) + "px";
        }

        function handleComposerKey(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendReply();
            }
        }

        async function sendReply() {
            if (!activePhone) return;
            const input = document.getElementById("replyInput");
            const text = input.value.trim();
            if (!text) return;

            const activeConversation = conversations.find(c => c.phone === activePhone);

            const btn = document.getElementById("replyBtn");
            btn.disabled = true;
            const originalLabel = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span>Envoi…';
            try {
                const res = await fetch("/api/conversation?key=" + encodeURIComponent(SECRET), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        phone: activePhone,
                        phoneNumberId: activeConversation?.phoneNumberId || "",
                        action: "reply",
                        message: text
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    toast("Erreur : " + (data.details || data.error || res.status), "error");
                    return;
                }
                input.value = "";
                autoGrow(input);
                await loadConversations();
            } catch (err) {
                console.error(err);
                toast("Erreur de connexion.", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = originalLabel;
            }
        }

        let toastTimer = null;
        function toast(msg, type) {
            const el = document.getElementById("toast");
            const icon = type === "error" ? "⚠️" : type === "success" ? "✅" : "ℹ️";
            el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
            el.className = type || "";
            el.style.display = "flex";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.display = "none"; }, 3000);
        }

        // Auto-login if a key was saved before.
        if (SECRET) loadConversations();
    </script>

</body>

</html>

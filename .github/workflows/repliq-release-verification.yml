name: RepliQ release verification
on:
  push:
    branches:
      - feature/ma-us-market-privacy-review
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and security regression suite
        run: npm test
      - name: Vercel function count
        run: npm run check:functions
      - name: Serverless runtime checks
        run: npm run test:vercel-runtime

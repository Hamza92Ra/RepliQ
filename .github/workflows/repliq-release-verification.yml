name: RepliQ release verification
on:
  push:
    branches:
      - feature/ma-us-market-privacy-review
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and security regression suite
        run: npm test
      - name: Vercel function count
        run: npm run check:functions
      - name: Install isolated Vercel runtime test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/repliq-vercel-runtime"
          npm install --prefix "$RUNNER_TEMP/repliq-vercel-runtime" --no-save --ignore-scripts --no-audit --no-fund @vercel/node @vercel/routing-utils
      - name: Serverless runtime checks
        run: node scripts/verify-vercel-runtime.mjs "$RUNNER_TEMP/repliq-vercel-runtime"
